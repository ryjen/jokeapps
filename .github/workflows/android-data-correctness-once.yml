name: Android data correctness qualification (one-shot)

on:
  push:
    branches: [fix/android-joke-key-and-cache-fallback-20261012]
    paths: [.github/workflows/android-data-correctness-once.yml]

permissions:
  contents: read
concurrency:
  group: jokeapps-data-correctness-20261012
  cancel-in-progress: false

jobs:
  android:
    name: Emulator and Android build gates
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - name: Provision SDK 31 and KVM
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-31" "build-tools;31.0.0"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
      - name: Execute Android app instrumentation
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          ram-size: 2048M
          emulator-boot-timeout: 420
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: |
            (cd apps/android && ./gradlew --no-daemon --console=plain :app:connectedDebugAndroidTest --stacktrace) || rc=$?
            adb logcat -d -s AndroidRuntime:E TestRunner:E Instrumentation:E | tail -n 80 || true
            exit "${rc:-0}"
      - name: Assert complete Android instrumentation coverage
        if: always()
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          files = list(Path('apps/android/app/build').rglob('TEST*.xml'))
          tests = failed = errors = skipped = 0
          for f in files:
              root = ET.parse(f).getroot()
              for suite in ([root] if root.tag == 'testsuite' else root.iter('testsuite')):
                  tests += int(suite.attrib.get('tests', 0))
                  failed += int(suite.attrib.get('failures', 0))
                  errors += int(suite.attrib.get('errors', 0))
                  skipped += int(suite.attrib.get('skipped', 0))
          print(f'Instrumentation XML files={len(files)} tests={tests} failures={failed} errors={errors} skipped={skipped}')
          assert tests >= 23, 'Expected baseline 19 plus 4 data correctness tests'
          assert failed == 0 and errors == 0 and skipped == 0, 'Instrumented suite has failures/errors/skips'
          PY
      - name: Unit tests, lint, debug and unsigned release APK
        working-directory: apps/android
        run: ./gradlew --no-daemon --console=plain test lint :app:assembleDebug :app:assembleRelease --stacktrace
