name: Layout validation

# Manual until monorepo job admission/runner policy is configured.
# This avoids automatically consuming hosted CI minutes during cutover.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify monorepo boundaries
        run: python3 scripts/verify-layout.py
