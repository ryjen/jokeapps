name: Android app-target instrumentation repair (one-shot)

on:
  push:
    branches: [fix/android-instrumentation-target-20261011]
    paths: [.github/workflows/instrumentation-fix-once.yml]

permissions:
  contents: read

concurrency:
  group: jokeapps-instrumentation-fix-20261011
  cancel-in-progress: false

jobs:
  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
      - name: Run instrumented APP tests on emulator API 31
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          ram-size: 2048M
          emulator-boot-timeout: 420
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb logcat -c || true
            (cd apps/android && ./gradlew --no-daemon --console=plain :app:connectedDebugAndroidTest --stacktrace) || task_rc=$?
            echo '=== FILTERED RUNTIME ERRORS ==='
            adb logcat -d -s AndroidRuntime:E TestRunner:E ActivityManager:E Instrumentation:E | tail -n 200 || true
            exit "${task_rc:-0}"
      - name: Verify nonzero tests and no failures
        if: always()
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          files = list(Path('apps/android/app/build').rglob('TEST*.xml'))
          tests = errors = failures = skipped = 0
          for f in files:
              root = ET.parse(f).getroot()
              for suite in ([root] if root.tag == 'testsuite' else root.iter('testsuite')):
                  tests += int(suite.attrib.get('tests', 0))
                  errors += int(suite.attrib.get('errors', 0))
                  failures += int(suite.attrib.get('failures', 0))
                  skipped += int(suite.attrib.get('skipped', 0))
          print(f'Android APP instrumentation XML files={len(files)} tests={tests} failures={failures} errors={errors} skipped={skipped}')
          assert tests > 0, 'No Android instrumentation tests were executed'
          assert failures == 0 and errors == 0, 'Android instrumentation assertions failed'
          PY
