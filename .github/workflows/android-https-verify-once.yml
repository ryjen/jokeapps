# Ephemeral qualification for issue #17; never merge this file.
# Accept equivalent origin-path representations in Ktor 2.0.1 MockEngine.
name: JokeApps HTTPS API qualification (one-shot)

on:
  push:
    branches: [fix/android-https-api-20261012]
    paths: [.github/workflows/android-https-verify-once.yml]

permissions:
  contents: read

concurrency:
  group: jokeapps-https-api-20261012
  cancel-in-progress: false

jobs:
  static:
    name: MockEngine regressions, unit, lint, APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - name: Provision Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-31" "build-tools;31.0.0"
      - name: Test MockEngine API fixtures, unit tests, lint and unsigned APKs
        working-directory: apps/android
        run: ./gradlew --no-daemon --console=plain test lint :app:assembleDebug :app:assembleRelease --stacktrace
      - name: Assert MockEngine tests ran
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files = list(Path('apps/android/data/build').rglob('TEST*.xml'))
          count = failures = errors = skipped = 0
          for f in files:
              root = ET.parse(f).getroot()
              for suite in ([root] if root.tag == 'testsuite' else root.iter('testsuite')):
                  if 'JokeServiceTest' not in suite.attrib.get('name', ''):
                      continue
                  count += int(suite.attrib.get('tests', 0))
                  failures += int(suite.attrib.get('failures', 0))
                  errors += int(suite.attrib.get('errors', 0))
                  skipped += int(suite.attrib.get('skipped', 0))
          print(f'JokeServiceTest MockEngine tests={count} failed={failures} errors={errors} skipped={skipped}')
          assert count == 6 and failures == 0 and errors == 0 and skipped == 0
          PY

  emulator:
    name: Android API31 instrumentation
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
      - name: Run instrumentation
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          ram-size: 2048M
          emulator-boot-timeout: 420
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: cd apps/android && ./gradlew --no-daemon --console=plain :app:connectedDebugAndroidTest --stacktrace
      - name: Assert no regression in instrumented test results
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files = list(Path('apps/android/app/build').rglob('TEST*.xml'))
          total = failures = errors = skipped = 0
          for f in files:
              root = ET.parse(f).getroot()
              for suite in ([root] if root.tag == 'testsuite' else root.iter('testsuite')):
                  total += int(suite.attrib.get('tests', 0))
                  failures += int(suite.attrib.get('failures', 0))
                  errors += int(suite.attrib.get('errors', 0))
                  skipped += int(suite.attrib.get('skipped', 0))
          print(f'API31 tests={total} failures={failures} errors={errors} skipped={skipped}')
          assert total >= 26 and failures == 0 and errors == 0 and skipped == 0
          PY
